<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>植物细胞 · 3D 互动课件（低多边形版）</title>
<style>
  :root{
    --bg:#f7f2e8; --card:#fffdf8; --line:#e8dfd0; --ink:#2f2a24; --ink2:#6f6558; --ink3:#a1958a;
    --green:#7ea75b; --leaf:#4e9a5b; --blue:#4b8fc7; --purple:#7c5ad6; --orange:#e08a4a;
    --serif:"Noto Serif SC","Songti SC","STSong",Georgia,"Times New Roman",serif;
    --sans:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;color:inherit;cursor:pointer}
  .top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;
       background:linear-gradient(180deg,#fffdf9,#faf5ec);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:11px}
  .logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;
        background:linear-gradient(140deg,#eaf3e2,#e6ecfb);border:1px solid var(--line);color:var(--leaf)}
  .brand h1{margin:0;font-family:var(--serif);font-size:19px;font-weight:600}
  .brand p{margin:2px 0 0;font-size:11.5px;color:var(--ink3);font-family:var(--serif);font-style:italic}
  .badge{font-size:11.5px;padding:5px 10px;border-radius:999px;background:#eef6ea;color:#4a7a34;border:1px solid #d8e9cf}
  .wrap{height:calc(100% - 62px);display:grid;grid-template-columns:236px minmax(0,1fr) 330px}
  .col{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
  .col.l{background:linear-gradient(180deg,#fbf7f0,#f8f2e8);border-right:1px solid var(--line)}
  .col.r{background:linear-gradient(180deg,#fbf7f0,#f8f2e8);border-left:1px solid var(--line)}
  .col::-webkit-scrollbar{width:8px}.col::-webkit-scrollbar-thumb{background:#e2d7c6;border-radius:8px}
  h2.sec{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:700}
  .tip{margin:6px 0 0;font-size:11.5px;line-height:1.7;color:var(--ink3)}
  .item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;border-radius:10px;
        border:1px solid transparent;background:transparent;font-size:13px;transition:.15s}
  .item:hover{background:#fffdf8;border-color:var(--line)}
  .item.on{background:#f1ecfd;border-color:#ddd2f8;color:#5f43b5;font-weight:600}
  .item i{width:9px;height:9px;border-radius:50%;flex:none}
  .item em{margin-left:auto;font-style:normal;font-size:10px;color:var(--ink3);font-family:var(--serif)}
  .stage{position:relative;overflow:hidden}
  #cv{position:absolute;inset:0}
  #labels{position:absolute;inset:0;pointer-events:none}
  .lab{position:absolute;transform:translate(-50%,-50%);padding:3px 9px;border-radius:999px;font-size:11.5px;
       background:rgba(255,253,248,.92);border:1px solid var(--line);box-shadow:0 1px 3px rgba(60,48,30,.08);
       white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:auto}
  .lab.on{opacity:1}
  .lab.sel{background:var(--purple);color:#fff;border-color:var(--purple);font-weight:600}
  .head{position:absolute;top:16px;left:18px;pointer-events:none}
  .head .eyebrow{margin:0 0 3px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);font-weight:700}
  .head h3{margin:0;font-family:var(--serif);font-size:25px;font-weight:600}
  .head p{margin:4px 0 0;font-size:11.5px;color:var(--ink3)}
  .bar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;
       border-radius:14px;background:rgba(255,253,248,.9);border:1px solid var(--line);
       box-shadow:0 6px 20px rgba(60,48,30,.10)}
  .btn{border:1px solid transparent;background:transparent;border-radius:10px;padding:7px 11px;font-size:12.5px;color:var(--ink2)}
  .btn:hover{background:#f6f1e8;border-color:var(--line)}
  .btn.on{background:#f1ecfd;border-color:#ddd2f8;color:#5f43b5;font-weight:600}
  .hint{position:absolute;bottom:70px;left:50%;transform:translateX(-50%) translateY(6px);padding:7px 14px;
        border-radius:999px;background:rgba(47,42,36,.88);color:#fff;font-size:12px;opacity:0;transition:.18s;pointer-events:none}
  .hint.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .clipwrap{position:absolute;top:16px;right:16px;width:186px;padding:10px;border-radius:12px;
            background:rgba(255,253,248,.92);border:1px solid var(--line);font-size:11px;color:var(--ink3)}
  .clipwrap.on .track{background:linear-gradient(90deg,#ded2f8,#cbbcf5)}
  .track{position:relative;height:6px;border-radius:99px;background:#e8dfd0;margin:8px 2px 4px}
  .knob{position:absolute;top:50%;left:40%;width:16px;height:16px;margin-left:-8px;transform:translateY(-50%);
        border-radius:50%;background:#fff;border:2px solid var(--green);cursor:grab}
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;
        box-shadow:0 1px 2px rgba(60,48,30,.05)}
  .card .ch{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
            color:var(--ink3);font-weight:700;margin-bottom:10px}
  .title{display:flex;align-items:center;gap:11px}
  .orb{width:44px;height:44px;border-radius:50%;flex:none;
       background:radial-gradient(circle at 32% 28%,#fff,var(--c) 70%);box-shadow:0 3px 12px rgba(60,48,30,.16)}
  .title h4{margin:0;font-family:var(--serif);font-size:23px;font-weight:600}
  .title .en{margin:2px 0 0;font-family:var(--serif);font-style:italic;font-size:12px;color:var(--ink3)}
  .alias{margin:10px 0 0;font-size:12.5px;color:#5f43b5;background:#f1ecfd;border:1px dashed #ddd2f8;
         border-radius:9px;padding:6px 10px}
  .role{margin:9px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.6}
  .card h5{margin:13px 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700}
  .card p{margin:0;font-size:12.5px;line-height:1.75;color:var(--ink2)}
  ul.li{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  ul.li li{position:relative;padding-left:15px;font-size:12.5px;line-height:1.65;color:var(--ink2)}
  ul.li li:before{content:"";position:absolute;left:2px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--green);opacity:.75}
  .exam{background:linear-gradient(180deg,#fffdf6,#fdf7ea);border-color:#f0e2c6}
  ul.li.ex li:before{content:"考";left:0;top:2px;font-size:10px;color:#d99a2b;background:none;font-weight:700}
  ul.li.ex li{padding-left:18px}
  .note{background:linear-gradient(180deg,#f8f6ff,#f3f0fe);border-color:#e3dcf8}
  .fps{position:absolute;top:16px;right:216px;font-size:11px;color:var(--ink3)}
  @media (max-width:1100px){ .wrap{grid-template-columns:200px minmax(0,1fr) 280px} .head h3{font-size:20px} }
  @media (max-width:860px){ body{overflow:auto} .wrap{grid-template-columns:1fr;height:auto} .stage{height:64vh}
    .col.l,.col.r{border:none;border-top:1px solid var(--line)} }
</style>
</head><body>
<div class="top">
  <div class="brand">
    <div class="logo">✿</div>
    <div>
      <h1>Cell Architecture Studio</h1>
      <p>植物细胞 · 低多边形 3D 互动课件</p>
    </div>
  </div>
  <div class="badge">离线可用 · 双击即开</div>
</div>

<div class="wrap">
  <aside class="col l">
    <section>
      <h2 class="sec">细胞结构</h2>
      <div id="list"></div>
      <p class="tip">点结构名，或直接点 3D 模型。</p>
    </section>
    <section>
      <h2 class="sec">快捷键</h2>
      <p class="tip"><b>R</b> 复位视角 · <b>L</b> 标注 · <b>S</b> 截图 · <b>Esc</b> 取消选中</p>
    </section>
  </aside>

  <section class="stage">
    <canvas id="cv"></canvas>
    <div id="labels"></div>
    <div class="head">
      <p class="eyebrow">交互式学习工作台</p>
      <h3 id="title">植物细胞 Plant Cell</h3>
      <p id="sub">拖动旋转 · 滚轮缩放 · 点击结构查看知识点</p>
    </div>
    <div class="fps" id="fps"></div>
    <div class="clipwrap" id="clipwrap">
      <div>剖面观察（已默认切开）</div>
      <div class="track" id="track"><div class="knob" id="knob"></div></div>
      <div style="margin-top:6px">双击滑块恢复完整细胞</div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="bar">
      <button class="btn" id="b-spin">自动旋转</button>
      <button class="btn on" id="b-lab">标注</button>
      <button class="btn" id="b-zoom">放大观察</button>
      <button class="btn" id="b-reset">复位视角</button>
      <button class="btn" id="b-shot">截图</button>
    </div>
  </section>

  <aside class="col r">
    <div id="panel"></div>
  </aside>
</div>

<script src="./libs/three.min.js"></script>
<script>/* ============================================================
 *  低多边形植物细胞 · 单文件交互课件
 *  依赖：./libs/three.min.js（本地化，断网可用）
 *  改知识点：编辑 DATA     改配色：编辑 PALETTE
 * ============================================================ */
var PALETTE = {
  bg:'#f7f2e8', wall:'#7ea75b', membrane:'#e8a2a0', cytosol:'#f6efdf',

};

var DATA = [
 { id:'wall', name:'细胞壁', en:'Cell Wall', alias:'植物细胞的铠甲', color:PALETTE.wall, off:[-0.4,2.35,0],

   exam:['常考：细胞壁全透性，不具选择透过性','原核细胞细胞壁成分是肽聚糖，与植物不同','质壁分离时水分可自由通过细胞壁'],

   note:'磷脂双分子层是地基，蛋白质是门窗和门卫，糖蛋白是身份证。' },
 { id:'cytosol', name:'细胞质基质', en:'Cytosol', alias:'流动的车间', color:PALETTE.cytosol, off:[-1.9,-0.9,1.2],
   role:'新陈代谢的主要场所',
   func:'含水、无机盐、脂质、糖类、氨基酸、核苷酸和多种酶，为细胞器提供物质和环境。',
   points:['细胞质 = 细胞质基质 + 细胞器','有氧呼吸第一阶段在此进行','无氧呼吸全过程也在此进行'],

   exam:['常考：质壁分离实验选紫色洋葱外表皮，便于观察','易错：原生质层不包括液泡内的细胞液'],

   note:'一叠叠硬币（基粒）负责抓光，基质负责组装有机物。' },
 { id:'mitochondria', name:'线粒体', en:'Mitochondrion', alias:'动力车间', color:PALETTE.mito,
   role:'有氧呼吸的主要场所',
   func:'把有机物中的化学能释放出来，合成 ATP，为生命活动提供能量。',
   points:['内膜向内折叠成嵴，增大酶附着面积','有氧呼吸第二、三阶段在此进行','含少量 DNA 和核糖体'],

 { id:'er', name:'内质网', en:'Endoplasmic Reticulum', alias:'加工车间与运输通道', color:PALETTE.er,

   exam:['常考：分泌蛋白的合成与运输路径，由线粒体供能'],
   note:'像高速公路网，一边收原料，一边把半成品送往下游。' },
 { id:'ribosome', name:'核糖体', en:'Ribosome', alias:'生产蛋白质的机器', color:PALETTE.ribo,

   func:'以 mRNA 为模板，把氨基酸连接成多肽链。',

];
function byId(id){ for (var i=0;i<DATA.length;i++) if (DATA[i].id===id) return DATA[i]; return null; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
var rnd = mulberry32(20261016);
function lerp(a,b,t){ return a+(b-a)*t; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function superBox(a,b,c,e,su,sv){
  var g = new THREE.SphereGeometry(1, su||20, sv||14);
  var p = g.attributes.position;
  for (var i=0;i<p.count;i++){
    var x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    p.setXYZ(i, Math.sign(x)*Math.pow(Math.abs(x),e)*a, Math.sign(y)*Math.pow(Math.abs(y),e)*b, Math.sign(z)*Math.pow(Math.abs(z),e)*c);
  }
  p.needsUpdate = true; g.computeVertexNormals(); return g;
}
/* 挖掉一角：低多边形"切开的教学盒子"效果（实心盒子 + 缺口） */
function cutCorner(geo, cutX, cutZ){
  var idx = geo.index.array, keep = [];
  var pos = geo.attributes.position;
  for (var i=0;i<idx.length;i+=3){
    var a=idx[i], b=idx[i+1], d=idx[i+2];
    var cx=(pos.getX(a)+pos.getX(b)+pos.getX(d))/3;
    var cz=(pos.getZ(a)+pos.getZ(b)+pos.getZ(d))/3;
    if (cx > cutX && cz > cutZ) continue;
    keep.push(a,b,d);
  }
  geo.setIndex(keep);
  geo.computeVertexNormals();
  return geo;
}/* ---------------- 渲染器 / 场景 / 光照 ---------------- */
var canvas = document.getElementById('cv');
var stage = document.querySelector('.stage');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.97;
renderer.localClippingEnabled = true;
/* 颜色管理：让十六进制颜色按 sRGB 正确解释（否则画面会整体发白） */
if (THREE.ColorManagement){
  if ('legacyMode' in THREE.ColorManagement) THREE.ColorManagement.legacyMode = false;
  if ('enabled' in THREE.ColorManagement) THREE.ColorManagement.enabled = true;
}

var scene = new THREE.Scene();
scene.background = new THREE.Color(PALETTE.bg);
var camera = new THREE.PerspectiveCamera(36, 1, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xffffff, 0xe4d9c6, 0.55));
var key = new THREE.DirectionalLight(0xfff6e6, 1.25); key.position.set(5,7,6); scene.add(key);
var fill = new THREE.DirectionalLight(0xdce8ff, 0.32); fill.position.set(-6,2,-4); scene.add(fill);
var rim = new THREE.DirectionalLight(0xffe9c9, 0.5); rim.position.set(-2,-5,4); scene.add(rim);

function solidMat(hex, opt){
  opt = opt || {};
  return new THREE.MeshStandardMaterial({ color:new THREE.Color(hex), flatShading:true,
    roughness: opt.rough==null?0.62:opt.rough, metalness:0.0 });
}
function shellMat(hex, opacity, rough){
  return new THREE.MeshStandardMaterial({ color:new THREE.Color(hex), flatShading:true,
    roughness: rough==null?0.45:rough, metalness:0.0, transparent:true, opacity:opacity,
    side: THREE.DoubleSide });
}

/* 在细胞质外壳撒点（避开液泡与细胞核） */
function shellPoints(count, opts){
  var a=opts.a,b=opts.b,c=opts.c,e=opts.e||0.44,inset=opts.inset||0.84,minD=opts.minD||0.5;
  var n=1/e, out=[], tries=0;
  var NC = new THREE.Vector3(CELL.nucleus.x,CELL.nucleus.y,CELL.nucleus.z);
  while(out.length<count && tries<4000){
    tries++;
    var u=rnd()*2-1, phi=rnd()*Math.PI*2, r=Math.sqrt(Math.max(0,1-u*u));
    var d=new THREE.Vector3(r*Math.cos(phi),u,r*Math.sin(phi));
    var v=Math.pow(Math.abs(d.x/a),n)+Math.pow(Math.abs(d.y/b),n)+Math.pow(Math.abs(d.z/c),n);
    var p=d.multiplyScalar(Math.pow(v,-1/n)*inset);
    var dx=(p.x-CELL.vacuole.x)/(CELL.vacuole.a*1.06), dy=p.y/(CELL.vacuole.b*1.06), dz=p.z/(CELL.vacuole.c*1.06);
    if (dx*dx+dy*dy+dz*dz < 1) continue;
    if (p.distanceTo(NC) < CELL.nucleus.r*1.25) continue;
    var ok=true; for (var i=0;i<out.length;i++){ if (out[i].distanceTo(p)<minD){ ok=false; break; } }
    if (!ok) continue;
    out.push(p);
  }
  return out;
}

function buildChloroplast(){
  var g = new THREE.Group(); var s = 0.44 + rnd()*0.10;
  var outer = new THREE.Mesh(new THREE.IcosahedronGeometry(1,1), shellMat(PALETTE.chloro,0.88,0.45));
  outer.scale.set(s*1.5, s*0.8, s*1.05); g.add(outer);
  var stackMat = solidMat('#2f7a3a',{rough:0.5});
  var dg = new THREE.CylinderGeometry(0.055,0.055,0.012,8);
  for (var i=0;i<4;i++){
    var st = new THREE.Group();
    for (var j=0;j<4;j++){ var d=new THREE.Mesh(dg,stackMat); d.position.y=j*0.018; st.add(d); }
    st.position.set((rnd()-0.5)*s*1.2,(rnd()-0.5)*s*0.5,(rnd()-0.5)*s*0.8);
    st.rotation.set(rnd()*3,rnd()*3,rnd()*3); g.add(st);
  }
  return g;
}

var view = { theta: 0.82, phi: 0.98, dist: 10.4 };
var goal = { theta: view.theta, phi: view.phi, dist: view.dist, target: new THREE.Vector3(0,0.15,0) };
var camTarget = new THREE.Vector3(0,0,0);
function applyCamera(){
  var sp = Math.sin(goal.phi), cp = Math.cos(goal.phi);
  camera.position.set(
    camTarget.x + goal.dist*sp*Math.sin(goal.theta),
    camTarget.y + goal.dist*cp,
    camTarget.z + goal.dist*sp*Math.cos(goal.theta));
  camera.lookAt(camTarget);
}
function updateCamera(dt){
  var k = 1 - Math.exp(-4.5*dt);
  view.theta = lerp(view.theta, goal.theta, k);
  view.phi   = lerp(view.phi,   goal.phi,   k);
  view.dist  = lerp(view.dist,  goal.dist,  k);
  camTarget.lerp(goal.target, k);
  applyCamera();
}
applyCamera();

var dragging=false, lastX=0, lastY=0, moved=0, pointers={}, pinchDist=0;
canvas.addEventListener('pointerdown', function(e){
  canvas.setPointerCapture(e.pointerId);
  pointers[e.pointerId]={x:e.clientX,y:e.clientY};
  dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY;
});
canvas.addEventListener('pointermove', function(e){
  if (pointers[e.pointerId]) pointers[e.pointerId]={x:e.clientX,y:e.clientY};
  var keys=Object.keys(pointers);
  if (dragging && keys.length===1){
    var dx=e.clientX-lastX, dy=e.clientY-lastY;
    moved += Math.abs(dx)+Math.abs(dy);
    goal.theta -= dx*0.008;
    goal.phi = clamp(goal.phi - dy*0.007, 0.28, Math.PI-0.34);
    lastX=e.clientX; lastY=e.clientY;
  } else if (keys.length===2){
    var a=pointers[keys[0]], b=pointers[keys[1]];
    var d=Math.hypot(a.x-b.x, a.y-b.y);
    if (pinchDist>0) goal.dist = clamp(goal.dist*(pinchDist/d), 3.4, 16);
    pinchDist = d;
  }
  hoverAt(e.clientX, e.clientY);
});
function endPointer(e){ if(pointers[e.pointerId]) delete pointers[e.pointerId]; if(Object.keys(pointers).length===0){ dragging=false; pinchDist=0; } }
canvas.addEventListener('pointerup', function(e){
  var wasDrag = moved>8;
  endPointer(e);
  if (!wasDrag){ var hit = pickAt(e.clientX,e.clientY,true) || pickAt(e.clientX,e.clientY,false); if (hit) select(hit); }
});
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  goal.dist = clamp(goal.dist*(1 + e.deltaY*0.0012), 3.4, 16);
}, { passive:false });
window.addEventListener('resize', resize);

/* ---------------- 拾取 ---------------- */
var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pickAt(cx, cy, solidOnly){
  var r = canvas.getBoundingClientRect();
  ndc.set(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, camera);
  var hits = ray.intersectObjects(root.children, true);
  for (var i=0;i<hits.length;i++){
    var o = hits[i].object;
    if (!o.visible) continue;
    var pick = o.userData.pick;
    if (!pick) continue;
    var isShell = (pick==='wall' || pick==='membrane' || pick==='cytosol');
    if (solidOnly && isShell) continue;
    if (!solidOnly && pick==='cytosol') continue;
    return pick;
  }
  return null;
}
var hovered=null;
function hoverAt(cx, cy){
  if (dragging) return;
  var id = pickAt(cx,cy,true) || pickAt(cx,cy,false);
  if (id===hovered) return;
  hovered = id;
  canvas.style.cursor = id ? 'pointer' : 'grab';
  var hint = document.getElementById('hint');
  if (id){ var d=byId(id); hint.innerHTML='<b>'+d.name+'</b> · '+d.en+' &nbsp;点击查看知识点'; hint.classList.add('on'); }
  else hint.classList.remove('on');
}

/* ---------------- 选中 / 高亮 ---------------- */
var selected=null, isolate=false, labelsOn=true;
function setDim(group, dim){
  group.traverse(function(o){
    if (!o.isMesh) return;
    var mats = Array.isArray(o.material)? o.material : [o.material];
    for (var i=0;i<mats.length;i++){
      var m = mats[i]; if (!m.isMeshStandardMaterial) continue;
      if (m.userData.o0===undefined){ m.userData.o0=m.opacity; m.userData.t0=m.transparent; m.userData.c0=m.color.getHex(); m.userData.e0=m.emissive.getHex(); }
      if (dim){
        var col = new THREE.Color(m.userData.c0); col.multiplyScalar(0.52);
        m.color.copy(col);
        m.opacity = m.userData.o0; m.transparent = m.userData.t0;
      } else {
        m.color.setHex(m.userData.c0);
        m.opacity = m.userData.o0; m.transparent = m.userData.t0;
      }
      m.needsUpdate = true;
    }
  });
}
function setGlow(group, on){
  group.traverse(function(o){
    if (!o.isMesh) return;
    var mats = Array.isArray(o.material)? o.material : [o.material];
    for (var i=0;i<mats.length;i++){
      var m = mats[i]; if (!m.emissive) continue;
      if (m.userData.e0===undefined) m.userData.e0 = m.emissive.getHex();
      if (on){ m.emissive.setHex(0xffcf6e); m.emissiveIntensity = 0.6; }
      else { m.emissive.setHex(m.userData.e0); m.emissiveIntensity = 1; }
    }
  });
}
function focus(id){
  var g = parts[id]; if (!g) return { center:new THREE.Vector3(), radius:0.6 };
  var best = g, kids = g.children;
  if (kids.length > 1){
    var bd = 1e9;
    for (var i=0;i<kids.length;i++){
      var c = new THREE.Box3().setFromObject(kids[i]).getCenter(new THREE.Vector3());
      var d = c.distanceTo(camera.position);
      if (d<bd){ bd=d; best=kids[i]; }
    }
  }
  var sph = new THREE.Box3().setFromObject(best).getBoundingSphere(new THREE.Sphere());
  return { center: sph.center.clone(), radius: clamp(sph.radius,0.25,3.2) };
}
function select(id, noFly){
  if (!parts[id]) return;
  if (selected && parts[selected]){ setGlow(parts[selected],false); parts[selected].scale.setScalar(1); }
  selected = id;
  setGlow(parts[id], true);
  parts[id].scale.setScalar(1.06);
  var info = focus(id);
  if (isolate){ for (var k in parts) parts[k].visible = (k===id); }
  else { for (var k2 in parts) setDim(parts[k2], k2!==id); }
  if (!noFly){ goal.target.copy(info.center); goal.dist = clamp(info.radius*5.4+2.6, 5.2, 14); }
  renderPanel(byId(id)); renderList(); updateHead(); syncLabels();
}/* ---------------- 列表 / 详情面板 ---------------- */
function renderList(){
  var html = '';
  for (var i=0;i<DATA.length;i++){
    var d = DATA[i];
    html += '<button class="item'+(d.id===selected?' on':'')+'" data-id="'+d.id+'">'
          + '<i style="background:'+d.color+'"></i><span>'+d.name+'</span><em>'+d.en.split(' ')[0]+'</em></button>';
  }
  var host = document.getElementById('list');
  host.innerHTML = html;
  var btns = host.querySelectorAll('.item');
  for (var j=0;j<btns.length;j++){
    btns[j].onclick = (function(el){ return function(){ select(el.getAttribute('data-id')); }; })(btns[j]);
  }
}
function ulLi(arr, cls){
  var s = '<ul class="li '+(cls||'')+'">';
  for (var i=0;i<arr.length;i++) s += '<li>'+arr[i]+'</li>';
  return s + '</ul>';
}

function syncLabels(){
  for (var id in labels){
    labels[id].el.classList.toggle('on', labelsOn || id===selected);
    labels[id].el.classList.toggle('sel', id===selected);
  }
}
function updateLabels(){
  var w = stage.clientWidth, h = stage.clientHeight;
  for (var id in labels){
    var L = labels[id];
    var visible = (labelsOn || id===selected) && parts[id] && parts[id].visible;
    if (!visible){ L.el.style.opacity = 0; continue; }
    var info = focus(id);
    var d0 = byId(id);
    var off = (d0 && d0.off) ? new THREE.Vector3(d0.off[0], d0.off[1], d0.off[2])
                             : new THREE.Vector3(0, info.radius*0.95+0.08, 0);
    var p = info.center.clone().add(off);
    p.project(camera);
    if (p.z > 1){ L.el.style.opacity = 0; continue; }
    L.el.style.left = ((p.x*0.5+0.5)*w)+'px';
    L.el.style.top  = ((-p.y*0.5+0.5)*h)+'px';
    L.el.style.opacity = 1;
  }
}

/* ---------------- 剖面 ---------------- */
function setClip(on){
  for (var i=0;i<clippedMats.length;i++){
    clippedMats[i].clippingPlanes = on ? [clipX, clipZ] : [];
    clippedMats[i].needsUpdate = true;
  }
  document.getElementById('clipwrap').classList.toggle('on', on);
}
(function initClip(){
  var track = document.getElementById('track'), knob = document.getElementById('knob');
  var drag=false;
  function setFrom(e){
    var r = track.getBoundingClientRect();
    var x = clamp((e.clientX-r.left)/r.width, 0, 1);
    knob.style.left = (x*100)+'%';
    clipX.constant = 2.3 - x*4.4;
    clipZ.constant = 2.3 - x*4.4;
    setClip(true);
  }
  track.addEventListener('pointerdown', function(e){ drag=true; setFrom(e); });
  track.addEventListener('pointermove', function(e){ if (drag) setFrom(e); });
  window.addEventListener('pointerup', function(){ drag=false; });
  track.addEventListener('dblclick', function(){ knob.style.left='100%'; clipX.constant=2.3; clipZ.constant=2.3; setClip(false); });
  setClip(true);
})();

/* ---------------- 工具栏 ---------------- */
var spin = false;
document.getElementById('b-spin').onclick = function(){ spin=!spin; this.classList.toggle('on', spin); };
document.getElementById('b-lab').onclick  = function(){ labelsOn=!labelsOn; this.classList.toggle('on', labelsOn); syncLabels(); };
document.getElementById('b-zoom').onclick = function(){
  if (!selected){ alert('请先点选一个结构'); return; }
  isolate = !isolate; this.classList.toggle('on', isolate);
  if (isolate){ for (var k in parts) parts[k].visible = (k===selected); }
  else { for (var k2 in parts){ parts[k2].visible = true; setDim(parts[k2], k2!==selected); } }
  var info = focus(selected);
  goal.target.copy(info.center); goal.dist = clamp(info.radius*4.6+2.2, 4.6, 13);
  updateHead();
};
document.getElementById('b-reset').onclick = function(){
  isolate=false; document.getElementById('b-zoom').classList.remove('on');
  for (var k in parts){ parts[k].visible=true; setDim(parts[k], false); }
  goal.theta=0.82; goal.phi=0.98; goal.dist=10.4; goal.target.set(0,0.15,0);
  if (selected){ setGlow(parts[selected], false); parts[selected].scale.setScalar(1); }
  selected=null; renderPanel(null); renderList(); updateHead(); syncLabels();
};
document.getElementById('b-shot').onclick = function(){
  var a = document.createElement('a');
  a.href = renderer.domElement.toDataURL('image/png');
  a.download = 'plant-cell.png'; a.click();
};
document.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if (k==='r') document.getElementById('b-reset').click();
  if (k==='l') document.getElementById('b-lab').click();
  if (k==='s') document.getElementById('b-shot').click();
  if (e.key==='Escape'){
    for (var kk in parts){ setGlow(parts[kk],false); setDim(parts[kk],false); parts[kk].visible=true; parts[kk].scale.setScalar(1); }
    selected=null; isolate=false; document.getElementById('b-zoom').classList.remove('on');
    renderPanel(null); renderList(); updateHead(); syncLabels();
  }
});

/* ---------------- 主循环 ---------------- */
var clock = new THREE.Clock(), frames=0, acc=0;
function resize(){
  var w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();
function tick(){
  requestAnimationFrame(tick);
  var dt = Math.min(clock.getDelta(), 0.05);
  if (spin) goal.theta += dt*0.22;
  updateCamera(dt);
  if (selected && parts[selected]){
    parts[selected].scale.setScalar(1.06 + Math.sin(performance.now()*0.0028)*0.012);
  }
  renderer.render(scene, camera);
  updateLabels();
  frames++; acc += dt;
  if (acc > 0.5){ document.getElementById('fps').textContent = Math.round(frames/acc)+' FPS'; frames=0; acc=0; }
}
renderList(); renderPanel(null); updateHead(); syncLabels(); tick();
window.__cell = { scene:scene, camera:camera, parts:parts, select:select, goal:goal, focus:focus };
</script>
</body>
</html>
